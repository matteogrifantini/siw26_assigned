<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: header('Modifica Recensione')}"></head>
<body>

    <nav th:replace="~{fragments/base :: navbar}"></nav>
    <div th:replace="~{fragments/base :: alerts}"></div>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card shadow p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2">
                        <h1 class="h4 fw-bold mb-0">
                            <i class="bi bi-pencil-square text-warning me-2"></i>Modifica Recensione
                        </h1>
                        <a th:href="@{'/film/' + ${recensione.film.id}}" class="btn btn-outline-secondary btn-sm">Annulla</a>
                    </div>

                    <p class="text-muted small mb-4">
                        Stai modificando la tua recensione per il film: 
                        <strong class="text-dark" th:text="${recensione.film.titolo}">Film</strong>
                    </p>

                    <form th:action="@{'/recensioni/aggiorna/' + ${recensione.id}}" method="post">
                        <div class="mb-3">
                            <label for="voto" class="form-label fw-semibold">Voto (da 1 a 5 stelle)</label>
                            <select id="voto" name="voto" class="form-select w-auto" required>
                                <option value="5" th:selected="${recensione.voto == 5}">★★★★★ - 5 (Eccellente)</option>
                                <option value="4" th:selected="${recensione.voto == 4}">★★★★☆ - 4 (Ottimo)</option>
                                <option value="3" th:selected="${recensione.voto == 3}">★★★☆☆ - 3 (Buono)</option>
                                <option value="2" th:selected="${recensione.voto == 2}">★★☆☆☆ - 2 (Sufficiente)</option>
                                <option value="1" th:selected="${recensione.voto == 1}">★☆☆☆☆ - 1 (Scarso)</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label for="testo" class="form-label fw-semibold">Testo della recensione</label>
                            <textarea id="testo" name="testo" rows="5" class="form-control" th:text="${recensione.testo}" required></textarea>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{'/film/' + ${recensione.film.id}}" class="btn btn-secondary">Annulla</a>
                            <button type="submit" class="btn btn-warning fw-bold">
                                <i class="bi bi-check-lg me-1"></i>Salva Modifiche
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
