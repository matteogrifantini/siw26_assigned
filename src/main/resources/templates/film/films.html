<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: header('Catalogo Film')}"></head>
<body>

    <nav th:replace="~{fragments/base :: navbar}"></nav>
    <div th:replace="~{fragments/base :: alerts}"></div>

    <main class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3 flex-wrap gap-2">
            <div>
                <h1 class="h2 fw-bold"><i class="bi bi-camera-reels text-warning me-2"></i>Catalogo Film</h1>
                <p class="text-muted mb-0">Tutti i film partecipanti ai festival cinematografici</p>
            </div>

            <form th:action="@{/film}" method="get" class="d-flex gap-2">
                <input type="text" name="q" th:value="${query}" class="form-control form-control-sm" placeholder="Cerca per titolo...">
                <button type="submit" class="btn btn-warning btn-sm fw-bold">Cerca</button>
                <a th:if="${query != null and !query.isBlank()}" th:href="@{/film}" class="btn btn-outline-secondary btn-sm">Reset</a>
            </form>
        </div>

        <div th:if="${films.isEmpty()}" class="alert alert-info">
            Nessun film trovato per i criteri di ricerca specificati.
        </div>

        <div class="row g-4" th:unless="${films.isEmpty()}">
            <div class="col-md-4 col-lg-3" th:each="film : ${films}">
                <div class="card h-100 shadow-sm">
                    <img th:if="${film.locandinaUrl != null}" th:src="${film.locandinaUrl}" class="film-poster" th:alt="${film.titolo}">
                    <div class="card-body d-flex flex-column">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <span class="badge bg-secondary" th:text="${film.genere}">Genere</span>
                            <span class="badge bg-light text-dark border" th:text="${film.anno}">2024</span>
                        </div>
                        <h2 class="h5 card-title fw-bold text-dark mb-1" th:text="${film.titolo}">Titolo</h2>
                        <p class="text-muted small mb-2">
                            Regia: 
                            <a th:if="${film.regista != null}" th:href="@{'/registi/' + ${film.regista.id}}" 
                               class="text-decoration-none text-dark fw-semibold" th:text="${film.regista.nomeCompleto}">
                                Regista
                            </a>
                            <span th:if="${film.regista == null}">N/D</span>
                        </p>
                        <p class="small text-muted mb-3">
                            <i class="bi bi-clock me-1"></i><span th:text="${film.durata} + ' minuti'">120 min</span> &bull; 
                            <span th:text="${film.paeseProduzione}">USA</span>
                        </p>

                        <div class="mt-auto pt-3 border-top d-flex justify-content-between align-items-center">
                            <span class="star-rating small">
                                <i class="bi bi-star-fill"></i>
                                <span class="fw-bold text-dark" th:text="${film.mediaVoti}">4.5</span>/5
                            </span>
                            <a th:href="@{'/film/' + ${film.id}}" class="btn btn-outline-dark btn-sm">Scheda Film</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
