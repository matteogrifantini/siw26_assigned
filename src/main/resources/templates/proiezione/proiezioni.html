<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: header('Programma Proiezioni')}"></head>
<body>

    <nav th:replace="~{fragments/base :: navbar}"></nav>
    <div th:replace="~{fragments/base :: alerts}"></div>

    <main class="container my-5">
        <div class="mb-4 border-bottom pb-3">
            <h1 class="h2 fw-bold mb-1"><i class="bi bi-calendar3 text-warning me-2"></i>Programma delle Proiezioni</h1>
            <p class="text-muted mb-0">Orari, sale cinematografiche e festival in calendario</p>
        </div>

        <div id="react-screenings-root">
            <div class="text-center py-5">
                <div class="spinner-border text-warning" role="status">
                    <span class="visually-hidden">Caricamento in corso...</span>
                </div>
                <p class="mt-2 text-muted">Caricamento in corso...</p>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel" th:src="@{/js/react-screenings.js}"></script>

</body>
</html>
