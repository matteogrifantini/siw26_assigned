<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: header('Programma Nuova Proiezione')}"></head>
<body>

    <nav th:replace="~{fragments/base :: navbar}"></nav>
    <div th:replace="~{fragments/base :: alerts}"></div>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card shadow p-4 border-0">
                    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
                        <div>
                            <h1 class="h4 fw-bold text-dark mb-0">
                                <i class="bi bi-calendar-plus text-primary me-2"></i>Programma Nuova Proiezione
                            </h1>
                            <small class="text-muted">Il sistema verificherà automaticamente che la sala sia libera nell'orario indicato.</small>
                        </div>
                        <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary btn-sm">Annulla</a>
                    </div>

                    <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                        <i class="bi bi-exclamation-octagon-fill me-2"></i>
                        <strong th:text="${errorMessage}">Errore sovrapposizione sala!</strong>
                    </div>

                    <form th:action="@{/admin/proiezioni/salva}" method="post">
                        <div class="mb-3">
                            <label for="festivalId" class="form-label fw-semibold">Festival *</label>
                            <select id="festivalId" name="festivalId" class="form-select" required>
                                <option value="">-- Seleziona Festival --</option>
                                <option th:each="f : ${festivals}" th:value="${f.id}" th:text="${f.nome + ' (' + f.anno + ')'}"
                                        th:selected="${f.id == selectedFestivalId}"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="filmId" class="form-label fw-semibold">Film *</label>
                            <select id="filmId" name="filmId" class="form-select" required>
                                <option value="">-- Seleziona Film --</option>
                                <option th:each="film : ${films}" th:value="${film.id}" 
                                        th:text="${film.titolo + ' (' + film.durata + ' min)'}"
                                        th:selected="${film.id == selectedFilmId}"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="salaId" class="form-label fw-semibold">Sala Cinematografica *</label>
                            <select id="salaId" name="salaId" class="form-select" required>
                                <option value="">-- Seleziona Sala --</option>
                                <option th:each="s : ${sale}" th:value="${s.id}" 
                                        th:text="${s.nome + ' (' + s.capienza + ' posti - ' + s.indirizzo + ')'}"
                                        th:selected="${s.id == selectedSalaId}"></option>
                            </select>
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label for="data" class="form-label fw-semibold">Data Proiezione *</label>
                                <input type="date" id="data" name="data" th:value="${selectedData}" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label for="ora" class="form-label fw-semibold">Orario di Inizio *</label>
                                <input type="time" id="ora" name="ora" th:value="${selectedOra}" class="form-control" required>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/admin/dashboard}" class="btn btn-secondary">Annulla</a>
                            <button type="submit" class="btn btn-primary fw-bold">
                                <i class="bi bi-calendar-check me-1"></i>Programma Proiezione
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
