<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: header(${festival.id == null ? 'Nuovo Festival' : 'Modifica Festival'})}"></head>
<body>

    <nav th:replace="~{fragments/base :: navbar}"></nav>
    <div th:replace="~{fragments/base :: alerts}"></div>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow p-4 border-0">
                    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
                        <h1 class="h4 fw-bold text-dark mb-0">
                            <i class="bi bi-trophy text-warning me-2"></i>
                            <span th:text="${festival.id == null ? 'Nuovo Festival' : 'Modifica Festival'}">Nuovo Festival</span>
                        </h1>
                        <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary btn-sm">Annulla</a>
                    </div>

                    <form th:action="@{/admin/festivals/salva}" th:object="${festival}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="row mb-3">
                            <div class="col-md-8">
                                <label for="nome" class="form-label fw-semibold">Nome Festival *</label>
                                <input type="text" id="nome" th:field="*{nome}" class="form-control"
                                       th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid' : ''" placeholder="es. Festival di Cannes">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                            </div>
                            <div class="col-md-4">
                                <label for="anno" class="form-label fw-semibold">Anno Edizione *</label>
                                <input type="number" id="anno" th:field="*{anno}" class="form-control"
                                       th:classappend="${#fields.hasErrors('anno')} ? 'is-invalid' : ''" placeholder="2026">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('anno')}" th:errors="*{anno}"></div>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label for="citta" class="form-label fw-semibold">Città *</label>
                                <input type="text" id="citta" th:field="*{citta}" class="form-control"
                                       th:classappend="${#fields.hasErrors('citta')} ? 'is-invalid' : ''" placeholder="es. Cannes">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('citta')}" th:errors="*{citta}"></div>
                            </div>
                            <div class="col-md-4">
                                <label for="dataInizio" class="form-label fw-semibold">Data Inizio *</label>
                                <input type="date" id="dataInizio" th:field="*{dataInizio}" class="form-control"
                                       th:classappend="${#fields.hasErrors('dataInizio')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('dataInizio')}" th:errors="*{dataInizio}"></div>
                            </div>
                            <div class="col-md-4">
                                <label for="dataFine" class="form-label fw-semibold">Data Fine *</label>
                                <input type="date" id="dataFine" th:field="*{dataFine}" class="form-control"
                                       th:classappend="${#fields.hasErrors('dataFine')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('dataFine')}" th:errors="*{dataFine}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="immagineUrl" class="form-label fw-semibold">URL o Percorso Immagine Banner</label>
                            <input type="text" id="immagineUrl" th:field="*{immagineUrl}" class="form-control" placeholder="/images/festivals/venezia.jpg">
                        </div>

                        <div class="mb-4">
                            <label for="descrizione" class="form-label fw-semibold">Descrizione</label>
                            <textarea id="descrizione" th:field="*{descrizione}" rows="4" class="form-control" placeholder="Descrizione del festival..."></textarea>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/admin/dashboard}" class="btn btn-secondary">Annulla</a>
                            <button type="submit" class="btn btn-warning fw-bold">
                                <i class="bi bi-check-circle me-1"></i>Salva Festival
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
