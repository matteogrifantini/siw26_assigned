<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: header('Accedi')}"></head>
<body>

    <nav th:replace="~{fragments/base :: navbar}"></nav>
    <div th:replace="~{fragments/base :: alerts}"></div>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow p-4">
                    <div class="text-center mb-4">
                        <i class="bi bi-person-lock text-warning display-4"></i>
                        <h2 class="h4 fw-bold mt-2">Accedi a CineFest</h2>
                        <p class="text-muted small">Inserisci le tue credenziali di accesso</p>
                    </div>

                    <div th:if="${param.error}" class="alert alert-danger py-2 small" role="alert">
                        <i class="bi bi-exclamation-circle me-1"></i> Username o password non corretti.
                    </div>

                    <div th:if="${param.logout}" class="alert alert-info py-2 small" role="alert">
                        <i class="bi bi-info-circle me-1"></i> Disconnessione effettuata con successo.
                    </div>

                    <div th:if="${param.registered}" class="alert alert-success py-2 small" role="alert">
                        <i class="bi bi-check-circle me-1"></i> Registrazione completata! Puoi effettuare il login.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Username</label>
                            <input type="text" id="username" name="username" class="form-control" required autofocus placeholder="es. user o admin">
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <input type="password" id="password" name="password" class="form-control" required placeholder="La tua password">
                        </div>

                        <button type="submit" class="btn btn-warning w-100 fw-bold py-2">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Accedi
                        </button>
                    </form>

                    <div class="mt-4 text-center border-top pt-3">
                        <p class="small text-muted mb-0">Non hai ancora un account?
                            <a th:href="@{/register}" class="fw-bold text-decoration-none">Registrati qui</a>
                        </p>
                    </div>

                    <div class="mt-3 p-2 bg-light rounded small border text-muted">
                        Credenziali demo: <code>user</code> / <code>user</code> &bull; <code>admin</code> / <code>admin</code>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
