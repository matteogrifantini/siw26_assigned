<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="header(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - CineFest SIW'">CineFest SIW</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">
                <i class="bi bi-film me-2"></i>CineFest
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain"
                    aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMain">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/festivals}">Festival</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/film}">Film</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/registi}">Registi</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/proiezioni}">Programma</a>
                    </li>
                </ul>

                <div class="d-flex align-items-center gap-2">
                    <div sec:authorize="isAnonymous()" class="d-flex gap-2">
                        <a th:href="@{/login}" class="btn btn-outline-light btn-sm">Accedi</a>
                        <a th:href="@{/register}" class="btn btn-primary btn-sm">Registrati</a>
                    </div>

                    <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2">
                        <a sec:authorize="hasAuthority('ROLE_ADMIN')" th:href="@{/admin/dashboard}" class="btn btn-danger btn-sm">
                            Amministrazione
                        </a>

                        <span class="text-light small">
                            <i class="bi bi-person me-1"></i>
                            <span sec:authentication="name"></span>
                        </span>

                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-outline-secondary btn-sm" title="Esci">
                                <i class="bi bi-box-arrow-right"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div th:fragment="alerts" class="container mt-3">
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${successMessage}">Operazione completata!</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${errorMessage}">Si è verificato un errore!</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>

    <footer th:fragment="footer" class="bg-dark text-secondary py-4 mt-5">
        <div class="container text-center">
            <p class="mb-1 text-light"><strong>CineFest</strong> - Festival Cinematografici</p>
            <p class="small mb-0">
                <a th:href="@{/analisi-prestazioni}" class="text-secondary text-decoration-none">Analisi Prestazioni</a> &bull;
                Sistemi Informativi su Web - Roma Tre
            </p>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </footer>

</body>
</html>
