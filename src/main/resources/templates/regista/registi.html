<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: header('Registi')}"></head>
<body>

    <nav th:replace="~{fragments/base :: navbar}"></nav>
    <div th:replace="~{fragments/base :: alerts}"></div>

    <main class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
            <div>
                <h1 class="h2 fw-bold"><i class="bi bi-person-video text-warning me-2"></i>Registi</h1>
                <p class="text-muted mb-0">I maestri della regia cinematografica</p>
            </div>
        </div>

        <div th:if="${registi.isEmpty()}" class="alert alert-info">
            Nessun regista registrato nel sistema.
        </div>

        <div class="row g-4" th:unless="${registi.isEmpty()}">
            <div class="col-md-4 col-lg-3" th:each="regista : ${registi}">
                <div class="card h-100 shadow-sm text-center p-3">
                    <div class="card-body">
                        <div class="mb-3">
                            <img th:if="${regista.fotoUrl != null}" th:src="${regista.fotoUrl}" class="regista-foto shadow-sm" th:alt="${regista.nomeCompleto}">
                            <div th:if="${regista.fotoUrl == null}" class="rounded-circle bg-light d-inline-flex align-items-center justify-content-center shadow-sm" style="width: 100px; height: 100px;">
                                <i class="bi bi-person-circle fs-1 text-secondary"></i>
                            </div>
                        </div>
                        <h2 class="h5 card-title fw-bold text-dark mb-1" th:text="${regista.nomeCompleto}">Nome Cognome</h2>
                        <p class="text-muted small mb-3">
                            <i class="bi bi-globe me-1"></i><span th:text="${regista.nazionalita}">Nazionalità</span> &bull; 
                            <span th:text="${#temporals.format(regista.dataNascita, 'yyyy')}">1970</span>
                        </p>
                        <p class="small text-secondary mb-3">
                            <strong><span th:text="${regista.filmDiretti.size()}">0</span></strong> film registrati
                        </p>
                        <a th:href="@{'/registi/' + ${regista.id}}" class="btn btn-outline-dark btn-sm w-100">
                            Vedi Filmografia &rarr;
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
