<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: header(${regista.nomeCompleto})}"></head>
<body>

    <nav th:replace="~{fragments/base :: navbar}"></nav>
    <div th:replace="~{fragments/base :: alerts}"></div>

    <main class="container my-5">
        <div class="card shadow-sm p-4 mb-5 border-0 bg-white">
            <div class="row align-items-center">
                <div class="col-md-auto text-center mb-3 mb-md-0" th:if="${regista.fotoUrl != null}">
                    <img th:src="${regista.fotoUrl}" class="regista-foto-lg shadow-sm" th:alt="${regista.nomeCompleto}">
                </div>
                <div class="col">
                    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                        <div>
                            <h1 class="display-5 fw-bold text-dark mb-1" th:text="${regista.nomeCompleto}">Nome Cognome</h1>
                            <p class="text-muted mb-2">
                                <i class="bi bi-globe me-1"></i>Nazionalità: <strong th:text="${regista.nazionalita}">Nazionalità</strong> &bull; 
                                <i class="bi bi-calendar3 me-1"></i>Nato il: <strong th:text="${#temporals.format(regista.dataNascita, 'dd/MM/yyyy')}">Data</strong>
                            </p>
                        </div>
                        <div>
                            <a th:href="@{/registi}" class="btn btn-outline-secondary btn-sm">&larr; Torna all'elenco</a>
                        </div>
                    </div>
                    <div th:if="${regista.biografia != null and !regista.biografia.isBlank()}" class="mt-2">
                        <p class="text-secondary mb-0" th:text="${regista.biografia}">Biografia del regista...</p>
                    </div>
                </div>
            </div>
        </div>

        <h2 class="h4 fw-bold mb-4"><i class="bi bi-film text-warning me-2"></i>Filmografia</h2>

        <div th:if="${regista.filmDiretti.isEmpty()}" class="alert alert-light border">
            Nessun film registrato per questo regista.
        </div>

        <div class="row g-4" th:unless="${regista.filmDiretti.isEmpty()}">
            <div class="col-md-4 col-lg-3" th:each="film : ${regista.filmDiretti}">
                <div class="card h-100 shadow-sm">
                    <img th:if="${film.locandinaUrl != null}" th:src="${film.locandinaUrl}" class="film-poster" th:alt="${film.titolo}">
                    <div class="card-body d-flex flex-column">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <span class="badge bg-secondary" th:text="${film.genere}">Genere</span>
                            <span class="badge bg-light text-dark border" th:text="${film.anno}">Anno</span>
                        </div>
                        <h3 class="h6 card-title fw-bold text-dark" th:text="${film.titolo}">Titolo</h3>
                        <p class="small text-muted mb-3">Durata: <span th:text="${film.durata} + ' min'">120 min</span></p>
                        <div class="mt-auto pt-2 d-flex justify-content-between align-items-center border-top">
                            <span class="star-rating small">
                                <i class="bi bi-star-fill"></i>
                                <span class="fw-bold text-dark" th:text="${film.mediaVoti}">4.5</span>
                            </span>
                            <a th:href="@{'/film/' + ${film.id}}" class="btn btn-sm btn-outline-dark">Vedi Film</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/base :: footer}"></footer>

</body>
</html>
